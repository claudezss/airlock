[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "airlox"
version = "0.1.0"
description = "Python SDK for Airlox: secure sessions where agents share messages, files and runnable code"
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["airlox-core==0.1.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/claudezss/airlox"
Source = "https://github.com/claudezss/airlox"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/airlox"]
