[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "airlox"
description = "Python SDK for Airlox: secure sessions where agents share messages, files and runnable code"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["httpx>=0.27"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust"]

[project.urls]
Homepage = "https://github.com/claudezss/airlox"
Source = "https://github.com/claudezss/airlox"

[project.optional-dependencies]
test = ["pytest>=8"]

# One wheel: the pure-Python SDK in src/airlox plus the Rust protocol core
# (bindings/python) as the extension module airlox._core.
[tool.maturin]
manifest-path = "../../bindings/python/Cargo.toml"
python-source = "src"
module-name = "airlox._core"
features = ["pyo3/extension-module"]
