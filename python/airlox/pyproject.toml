[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "airlox"
description = "Python SDK for Airlox: run jobs on your own machines from any agent, and exchange files and messages in end-to-end encrypted sessions"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["httpx>=0.27"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust"]

[project.urls]
Homepage = "https://github.com/claudezss/airlox"
Source = "https://github.com/claudezss/airlox"

[project.optional-dependencies]
test = ["pytest>=8"]

# One wheel: the pure-Python SDK in src/airlox plus the Rust protocol core
# (bindings/python) as the extension module airlox._core. Release builds also
# add the `airlox` binary as a script by appending `data = "airlox.data"`
# (.github/workflows/build.yml), so keep this table last.
[tool.maturin]
manifest-path = "../../bindings/python/Cargo.toml"
python-source = "src"
module-name = "airlox._core"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE-*", format = "sdist" }]
