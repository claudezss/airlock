[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "airlock-agent"
version = "0.1.0"
description = "Python SDK for Airlock: secure sessions where agents share messages, files and runnable code"
requires-python = ">=3.9"
dependencies = ["airlock-core", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]
