name: ci

# Runs on pull requests only: main requires up-to-date, passing PRs, so a push
# to main would re-test the same tree. Each job runs only when files it covers
# changed; `ci-ok` is the one required check and passes when every job that
# ran passed. Run it by hand to test everything.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      macos: ${{ github.event_name != 'pull_request' || steps.filter.outputs.macos == 'true' }}
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      wasm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.wasm == 'true' }}
      dist: ${{ github.event_name != 'pull_request' || steps.filter.outputs.dist == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build: &build
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - Makefile
              - .github/workflows/ci.yml
            rust:
              - *build
              - rustfmt.toml
              - 'crates/**'
              - 'bindings/**'
            # Platform-specific code: the runner and its sandboxes, and how the
            # Python extension links on macOS.
            macos:
              - *build
              - 'crates/airlox/**'
              - 'bindings/python/**'
            # The SDK tests drive the real relay and runner.
            python:
              - *build
              - 'crates/**'
              - 'bindings/python/**'
              - 'python/**'
            wasm:
              - *build
              - 'crates/airlox-core/**'
              - 'bindings/wasm/**'
            # Everything a release ships: the binary on every platform, the
            # wheels, the npm packages and the MCPB bundle.
            dist:
              - *build
              - 'crates/airlox-core/**'
              - 'crates/airlox/**'
              - 'bindings/python/**'
              - python/airlox/pyproject.toml
              - python/airlox/README.md
              - 'packaging/**'
              - .github/workflows/build.yml
              - .github/workflows/release.yml

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: make fmt lint test-rust

  rust-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: make test-rust

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv tool install maturin==1.8.6
      # Ubuntu 24.04 restricts unprivileged user namespaces, which the local sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make test-python test-sdk

  wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: make test-wasm

  # Builds and smoke-tests every package a release ships (build.yml), so a
  # packaging or platform breakage shows up before a tag.
  dist:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    uses: ./.github/workflows/build.yml

  # The single required check: green when every job that ran passed (skipped
  # jobs count as passing).
  ci-ok:
    if: always()
    needs: [changes, rust, rust-macos, python, wasm, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all required jobs passed or were not needed"
