name: release

# Push a tag `vX.Y.Z` (matching the workspace version) to build everything
# (build.yml) and publish it: the wheels and sdist to PyPI, the npm packages,
# a GitHub release with the binaries and the MCPB bundle, and then the MCP
# registry entry that names all three. Nothing is published unless every
# build succeeds. The publish jobs run in the `release` environment
# (docs/releasing.md). Each publish step skips what already exists, so the
# failed jobs of a release can be re-run; a GitHub release asset is never
# replaced, so a full re-run, whose rebuilt files differ, fails there instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only release commits that reached main (and so passed CI).
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Every package's version comes from the Rust workspace; the tag must match it.
      - run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          rust = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(f"tag={tag} version={rust}")
          if tag != rust:
              sys.exit("the tag does not match workspace.package.version")
          EOF

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  # The platform packages first, so the wrapper never points at a missing one.
  # npm trusted publishing: npm trusts this workflow in the `release`
  # environment (packaging/npm/bootstrap.sh), so there is no token, and it
  # adds provenance itself.
  npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm
          path: npm
      - env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for t in npm/airlox-*-"$VERSION".tgz npm/airlox-"$VERSION".tgz; do
            name=$(tar xzf "$t" -O package/package.json | jq -r .name)
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              # ./ so npm reads a file, not a GitHub user/repo shorthand.
              npm publish "./$t" --access public
            fi
          done

  github:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpb
          path: mcpb
      - name: Archive the binaries
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir release
          for d in bins/bin-*; do
            t=${d#bins/bin-}
            [ "$t" = universal-apple-darwin ] && continue
            name="airlox-$VERSION-$t"
            mkdir "$name"
            cp "$d"/airlox* LICENSE-MIT LICENSE-APACHE "$name/"
            chmod +x "$name"/airlox*
            case "$t" in
              *windows*) zip -qr "release/$name.zip" "$name" ;;
              *) tar czf "release/$name.tar.gz" "$name" ;;
            esac
          done
          cp "mcpb/airlox-$VERSION.mcpb" release/
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
      # Upload what is missing; an asset already there must be identical,
      # since PyPI, npm and the registry entry's bundle hash may already
      # describe it.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes
            exit 0
          fi
          have=$(gh release view "$TAG" --json assets -q '.assets[].name')
          mkdir published
          for f in release/*; do
            name=${f#release/}
            if printf '%s\n' "$have" | grep -qxF "$name"; then
              gh release download "$TAG" -p "$name" -D published
              cmp "$f" "published/$name" || { echo "::error::$name differs from the published asset"; exit 1; }
            else
              gh release upload "$TAG" "$f"
            fi
          done

  # The registry checks that each package exists and names this server (npm's
  # mcpName, the PyPI README's mcp-name, the bundle's URL), so this runs last.
  registry:
    needs: [build, pypi, npm, github]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # GitHub OIDC login for the io.github.claudezss namespace
    env:
      MCP_PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpb
          path: mcpb
      - run: |
          curl -fsSL -o mcp-publisher.tar.gz "$MCP_PUBLISHER"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # PyPI and npm can take a moment to serve a version just published.
      - run: |
          cp mcpb/server.json server.json
          for i in 1 2 3 4 5; do
            out=$(./mcp-publisher publish 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            echo "$out" | grep -qi "already exists\|cannot publish duplicate" && exit 0
            sleep $((i * 30))
          done
          exit 1
