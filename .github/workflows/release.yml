name: release

# Push a tag `vX.Y.Z` (matching the workspace version) to build the `airlox`
# wheels and sdist and publish them to PyPI. Nothing is uploaded unless every
# build succeeds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Only release commits that reached main (and so passed CI).
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The package version comes from the Rust workspace; the tag must match it.
      - run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          rust = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(f"tag={tag} version={rust}")
          if tag != rust:
              sys.exit("the tag does not match workspace.package.version")
          EOF

  wheels:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, native: true }
          - { os: ubuntu-latest, target: aarch64, native: false }
          - { os: macos-latest, target: x86_64, native: false }
          - { os: macos-latest, target: aarch64, native: true }
          - { os: windows-latest, target: x64, native: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python/airlox
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # Install the wheel and load the Rust core, where the runner can run it.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: matrix.native
      - if: matrix.native
        run: uv run --isolated --no-project --find-links python/airlox/dist --with airlox python -c "import airlox, airlox._core as c; print('airlox core', c.PROTOCOL_VERSION)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: python/airlox/dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python/airlox
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-sdist
          path: python/airlox/dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}
