[package]
name = "airlox"
description = "The airlox CLI, runner and MCP server: a sandboxed job slot on your own machines for any coding agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "airlox"
path = "src/main.rs"

[dependencies]
airlox-core = { workspace = true, features = ["image", "fs"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs", "hostname", "user", "sched", "mount"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
caps = "0.5"
signal-hook = "0.4"

[dev-dependencies]
image.workspace = true
airlox-server = { path = "../airlox-server" }

# The workspace forbids unsafe code. This crate only denies it, so that one
# module (sandbox/winjob.rs, the Windows Job Object and token calls) can allow
# it; everything else still may not use it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
