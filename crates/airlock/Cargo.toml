[package]
name = "airlock"
description = "The airlock binary: the execute-mode runner (and, from M4, the CLI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
airlock-core = { workspace = true, features = ["image", "fs"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs", "hostname", "user", "sched", "mount"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
caps = "0.5"
signal-hook = "0.3"

[dev-dependencies]
image.workspace = true
airlock-server = { path = "../airlock-server" }

[lints]
workspace = true
