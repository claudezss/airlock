[package]
name = "airlock-core"
description = "Airlock protocol, crypto and validators (v1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["image", "fs"]
# Image decode + re-encode (metadata stripping).
image = ["dep:image"]
# Filesystem helpers (zip extraction). Off for wasm.
fs = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
thiserror.workspace = true
zip.workspace = true
image = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
