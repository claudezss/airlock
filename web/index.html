      <p class="lp-eyebrow accent">A job slot on your own machines, for any coding agent</p>
      <h1>Give your agent a job slot, not a login.</h1>
      <p class="lp-lede">Pair a machine once. Your coding agent, local or hosted, runs tests, builds and scripts on it in a sandbox with signed limits, through NAT and firewalls where SSH cannot reach. Output streams back, the result is signed by the machine that ran it, and the relay in between sees only ciphertext.</p>
      <div class="row lp-actions">
        <a class="button primary cta" href="#api">Pair a machine <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        <a class="button cta" href="/new">Open a session</a>
      </div>
      <p class="lp-install mono"><span class="accent" aria-hidden="true">$</span> <span class="sr-only">Install with </span>npm install -g airlox <span class="muted">· or</span> pip install airlox</p>
      <p class="lp-live mono" id="live-stat" hidden><span class="dot" aria-hidden="true"></span><span><strong id="live-stat-n">0</strong> <span id="live-stat-label">sessions active on this relay right now</span></span></p>
      <p class="lp-join">Have an invite link? Open it in this browser to join that session. The key stays in the part of the link after the <code>#</code>, which is never sent to the relay. Have a code like <code>7-guitar-orbit</code> instead? <a href="/receive">Enter it here</a>.</p>

<section id="modes" class="lp-section lp-alt">
  <div class="lp-inner lp-stack-lg">
    <div class="lp-head">
      <p class="lp-eyebrow">01 · How it works</p>
      <h2>One command on the machine. One from the agent.</h2>
      <p class="lp-sub">The runner joins with a one-time code. The agent sends a shell command and its working tree; output streams back, and the result is signed by the machine that ran it. Both ends talk outbound HTTPS to the relay, so nothing needs an open port.</p>
    </div>

    <div class="lp-cards two">
      <article class="lp-card big">
        <div class="lp-card-title">
          <div class="lp-ic tint"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"></path></svg></div>
          <h3>Machine</h3>
        </div>
        <p>A box you own, paired once: the GPU workstation, the build server behind the firewall, the laptop with the licensed toolchain. Each job is one sandboxed process with the limits the session signed; the runner keeps a warm workspace per sender, so <code>node_modules</code> and <code>target/</code> survive between runs.</p>
        <div class="lp-flow long mono" role="img" aria-label="An agent sends pytest and its working tree to the machine gpu-box, and a signed result comes back">
          <span class="node">agent</span>
          <svg class="flow" width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 8h22l-4-4M24 8l-4 4"></path></svg>
          <span class="node accent">pytest + tree</span>
          <svg class="flow" width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 8h22l-4-4M24 8l-4 4"></path></svg>
          <span class="node">gpu-box</span>
          <svg class="flow ok" width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M26 8H4l4-4M4 8l4 4"></path></svg>
          <span class="node ok">signed result</span>
        </div>
      </article>

      <article class="lp-card big">
        <div class="lp-card-title">
          <div class="lp-ic info"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"></path></svg></div>
          <h3>Room</h3>
        </div>
        <p>The same session also carries messages and files between agents, or between an agent and a person watching. Hand a review to a bot on another machine, let a lead observe, or have two agents wake each other with addressed messages. Markdown and Python arrive as text and are never run.</p>
        <div class="lp-flow mono" role="img" aria-label="Agent A and agent B exchange items through the session">
          <span class="node">agent A</span>
          <svg class="flow" width="40" height="16" viewBox="0 0 40 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5h34l-4-4M38 11H4l4 4"></path></svg>
          <span class="node info">session</span>
          <svg class="flow" width="40" height="16" viewBox="0 0 40 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5h34l-4-4M38 11H4l4 4"></path></svg>
          <span class="node">agent B</span>
        </div>
      </article>
    </div>

    <ol class="lp-steps">
      <li><span class="num mono" aria-hidden="true">1</span><strong>Pair</strong><span><code>airlox machine add gpu-box</code> prints one command for the machine. The runner joins with a one-time code; you see its key and approve exactly that runner. Keys ride in invite fragments and never reach the relay.</span></li>
      <li><span class="num mono" aria-hidden="true">2</span><strong>Run</strong><span><code>airlox run --on gpu-box --tree -- pytest</code> sends the command and the working tree as it is right now, uncommitted changes included, ignored paths and credential-named files left out. After the first run only changed files go.</span></li>
      <li><span class="num mono" aria-hidden="true">3</span><strong>Stream</strong><span>stdout and stderr arrive as the job runs, encrypted and signed like everything else. The job is one process in the sandbox: no login, no persistence outside its workspace, no network unless you allow it.</span></li>
      <li><span class="num mono" aria-hidden="true">4</span><strong>Signed result</strong><span>Exit code, timing, output files, the image digest and the tree's commit, signed by the runner and bound to the job. The relay purges a session when it ends; machines last until you remove them.</span></li>
    </ol>
  </div>
</section>

<section id="ssh" class="lp-section">
  <div class="lp-inner lp-stack-md">
    <div class="lp-head">
      <p class="lp-eyebrow">02 · Why not SSH</p>
      <h2>A login is more than an agent needs, and less than a hosted one can use.</h2>
      <p class="lp-sub">For a trusted local agent and a machine you can already reach, SSH is fine. The difference shows in what you hand the model, what it can do with it, and where it works at all.</p>
    </div>
    <div class="lp-tiles">
      <div class="lp-tile"><h3>What you hand the agent</h3><p><strong>SSH:</strong> a private key, long-lived, reusable from anywhere, until you notice and revoke it. <strong>Airlox:</strong> a role in a session that submits sandboxed jobs to runners you approved, and does nothing else. Leaked, it is a job slot until you remove the machine, not a login.</p></div>
      <div class="lp-tile"><h3>What it can do</h3><p><strong>SSH:</strong> a shell, your filesystem, your network, your other keys, agent forwarding, lateral movement. <strong>Airlox:</strong> one process per job in a container or namespace sandbox with declared time, memory and network limits, and a workspace of its own. The restrictions you would bolt onto SSH for a model, built in.</p></div>
      <div class="lp-tile"><h3>Where it works</h3><p><strong>SSH:</strong> needs an inbound path: a public port, a VPN, a bastion, Tailscale on both ends. <strong>Airlox:</strong> outbound HTTPS from both ends. It reaches a laptop behind NAT, a box behind the corporate firewall, and it works from hosted agents (Claude Code on the web, Codex cloud) whose sandboxes have no SSH client, no key store and HTTPS-only egress.</p></div>
    </div>
  </div>
</section>

<section id="types" class="lp-section">
  <div class="lp-inner lp-stack-md">
    <div class="lp-head">
      <p class="lp-eyebrow">04 · Also a room for agents</p>
      <h2>Hand off files and messages too.</h2>
      <p class="lp-sub">Beyond jobs, a session carries four content types between agents and people, each checked on arrival: images preview, ZIPs list their contents, and nothing is ever run on the way through.</p>
    </div>
    <div class="lp-cards four">
      <article class="lp-card">
        <p class="lp-ext mono accent">.sh .py</p>
        <h3>Jobs and code</h3>
        <p>A shell command with your working tree, or a Python file, submitted as a job with a timeout, memory limit and the session's package allowlist. Shared without running, they arrive as text.</p>
      </article>
      <article class="lp-card">
        <p class="lp-ext mono link">.md</p>
        <h3>Markdown</h3>
        <p>Shared as text and delivered byte for byte, so agents receive the original file untouched.</p>
      </article>
      <article class="lp-card">
        <p class="lp-ext mono link">.zip</p>
        <h3>ZIP archives</h3>
        <p>Manifest listed before download. Path traversal, zip bombs and symlinks are rejected; the runner unpacks only into the job's work dir.</p>
      </article>
      <article class="lp-card">
        <p class="lp-ext mono ok">.png .jpg .webp</p>
        <h3>Images</h3>
        <p>Previewed in the timeline, with metadata stripped by re-encoding before they are sent. Images a job writes to <code>$AIRLOX_OUT</code> come back the same way.</p>
      </article>
    </div>
  </div>
</section>

<section id="api" class="lp-section lp-alt">
  <div class="lp-inner lp-api-grid">
    <div class="lp-api-copy">
      <p class="lp-eyebrow">05 · Built for agents</p>
      <h2>Pair once. Then any agent, any checkout.</h2>
      <p class="lp-sub">The <code>airlox</code> binary is the CLI, the runner and the MCP server. Coding agents with a shell use the CLI (a skill teaches them); Codex and Claude Code can also use the MCP server; other agents use the Python SDK or plain HTTPS. A hosted agent gets the machine's sender invite in <code>AIRLOX_INVITE</code> and nothing else.</p>
      <ul class="lp-endpoints mono">
        <li>POST /v1/sessions/:id/items</li>
        <li>POST /v1/sessions/:id/jobs <span class="muted">(runner | labels | any)</span></li>
        <li>GET&nbsp; /v1/sessions/:id/runners</li>
        <li>GET&nbsp; /v1/sessions/:id/stream <span class="muted">(SSE)</span></li>
      </ul>
    </div>
    <div class="lp-api-code">
      <div class="lp-codecard">
        <div class="lp-codecard-head mono">pair · once, on your side</div>
        <pre role="region" tabindex="0" aria-label="pairing a machine"><span class="accent">$</span> airlox machine add gpu-box --image ghcr.io/me/ci:latest
<span class="muted">On the machine, run:</span>
  airlox runner join --code 7-guitar-orbit --name gpu-box \
    --sandbox docker --image ghcr.io/me/ci:latest --workspace
<span class="muted">Waiting for it to join… gpu-box joined (key 3kQv…). Approve? [y/N]</span> y</pre>
      </div>
      <div class="lp-codecard">

<section id="security" class="lp-section lp-alt">
  <div class="lp-inner lp-stack-md">
    <div class="lp-head">
      <p class="lp-eyebrow">06 · Security model</p>
      <h2>The server relays ciphertext. The runner trusts nothing.</h2>
      <p class="lp-sub">A job can do whatever its sandbox allows, no more, and nothing is filtered on the way out. What a machine can reach is the operator's choice; the owner approves every runner, and can see each job before it runs.</p>
    </div>
    <div class="lp-tiles">
      <div class="lp-tile"><h3>End-to-end encrypted</h3><p>The session key lives in the invite fragment. Items are encrypted before upload; the relay stores ciphertext and the routing metadata it needs (names, public keys, item kinds, sizes, timing), never content or keys.</p></div>
      <div class="lp-tile"><h3>Role-scoped invites</h3><p>Owner, sender, observer and runner links carry different rights, and each role's key is fixed in the manifest the owner signed.</p></div>
      <div class="lp-tile"><h3>Signed items</h3><p>Each participant gets a per-session keypair. Every message, file and job is signed, so a runner only executes jobs from a sender or the owner.</p></div>
      <div class="lp-tile"><h3>Sandboxed execution</h3><p>Code never runs on the relay, only on runners the receiver started on their own machines. Each job is one process in a container (or Linux namespaces and Landlock) with no network by default, memory and time limits, a read-only root, dropped capabilities and a workspace of its own. The sandbox is the boundary; the kind of job does not change it.</p></div>
      <div class="lp-tile"><h3>Short-lived by default</h3><p>Sessions expire on a timer you set, or last until you close them, and the relay purges them. It keeps no database and nothing after a session ends.</p></div>
      <div class="lp-tile"><h3>Owner approval</h3><p>Execute sessions can require the owner to approve each runner before it receives any work.</p></div>
    </div>
  </div>
</section>
