# The relay behind Caddy (automatic HTTPS). Lives in /opt/airlox on the host,
# next to a .env with AIRLOX_DOMAIN, AIRLOX_IMAGE and AIRLOX_SHA; airlox-deploy
# installs this file and caddy/Caddyfile from the commit it deploys. See
# docs/deploy.md.
services:
  airlox:
    image: ${AIRLOX_IMAGE:?set AIRLOX_IMAGE in .env}
    restart: unless-stopped
    environment:
      # Caddy replaces X-Forwarded-For with the client address; the relay reads
      # its last entry for per-IP limits.
      AIRLOX_TRUST_PROXY: "true"
      NO_COLOR: "1"
    volumes:
      - airlox-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 640m
    pids_limit: 256
    stop_grace_period: 20s
    # The relay needs no outbound access (not even the cloud metadata
    # service): it is only on a network without a route out.
    networks: [relay]
    logging:
      driver: local

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    depends_on: [airlox]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AIRLOX_DOMAIN: ${AIRLOX_DOMAIN:?set AIRLOX_DOMAIN in .env}
    volumes:
      # A directory, not the single file: replacing the Caddyfile on the host
      # is then visible to `caddy reload` in the running container.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 256
    # default: the published ports and certificate renewal; relay: the relay.
    networks: [default, relay]
    logging:
      driver: local

networks:
  relay:
    internal: true

volumes:
  airlox-data:
  caddy-data:
  caddy-config:
