[package]
name = "airlock-core-wasm"
description = "WebAssembly bindings for airlock-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
airlock-core = { workspace = true, default-features = false, features = ["image"] }
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"
getrandom = { workspace = true, features = ["js"] }

[lints]
workspace = true
