[workspace]
resolver = "2"
members = ["crates/airlox-core", "crates/airlox-server", "crates/airlox", "bindings/python", "bindings/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/claudezss/airlox"

[workspace.dependencies]
airlox-core = { path = "crates/airlox-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.11"
hkdf = "0.12"
aes-gcm = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
thiserror = "2"
zeroize = "1"
unicode-normalization = "0.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
# Cargo strips release builds with the system `strip` by default; on macOS 27
# that corrupts the Python extension (dyld: "mis-aligned LINKEDIT string pool").
strip = false
